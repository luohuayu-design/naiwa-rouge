<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080f14">
<link rel="icon" href="data:,">
<title>蛙步 · 夜行</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<!-- 3D 画布 -->
<div id="app"></div>

<!-- 触摸层：只负责接收浮动摇杆的手势，不挡 HUD -->
<div id="touchLayer"></div>

<!-- 浮动摇杆：按下前隐藏，按在左半屏任意位置才在落点出现 -->
<div id="stick" class="stick">
  <div class="stick-ring"></div>
  <div class="stick-knob"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-title">蛙步 · 夜行</div>
  <button class="hp-card" id="hpCard" type="button" aria-label="查看奶蛙属性">
    <div class="hp-top">
      <span class="hp-label">生命</span>
      <span class="hp-num"><b id="hpCur">6</b><i>/</i><span id="hpMax">6</span></span>
      <span class="hp-more">属性 ▸</span>
    </div>
    <div class="hp-bar"><i id="hpFill"></i></div>
  </button>
  <div class="hud-key" id="hudKey"></div>
  <div class="hud-stats" id="stats"></div>
</div>

<!-- 右上角：波次进度 -->
<div id="waveHud">
  <div class="wh-top">
    <span class="wh-level">第 1 关</span>
    <span class="wh-wave" id="whWave">准备</span>
  </div>
  <div class="wh-sub" id="whSub">荒草地</div>
  <div class="wh-bar"><i id="whFill"></i></div>
</div>

<!-- 波次提示（居中淡入淡出） -->
<div id="waveToast">
  <b id="wtTitle">第 1 波</b>
  <span id="wtSub">小兵从草里钻出来了</span>
</div>

<!-- 右下角技能栏：3 行 2 列共 6 格，按获得顺序填充（暂只开放第 1 格「环剑」） -->
<div id="skillBar" aria-hidden="true">
  <button class="sk" id="sk0" type="button" aria-label="万剑齐发">
    <img src="assets/weapons/icon-sword.png" alt="" draggable="false">
    <i class="sk-cd"></i>
  </button>
  <button class="sk empty" type="button" disabled aria-label="未获得"></button>
  <button class="sk empty" type="button" disabled aria-label="未获得"></button>
  <button class="sk empty" type="button" disabled aria-label="未获得"></button>
  <button class="sk empty" type="button" disabled aria-label="未获得"></button>
  <button class="sk empty" type="button" disabled aria-label="未获得"></button>
</div>

<!-- 受击红闪 -->
<div id="hurtFx"></div>

<!-- 属性详情面板 -->
<div id="attrPanel" class="attr-panel" aria-hidden="true">
  <div class="ap-card">
    <div class="ap-head">
      <div>
        <div class="ap-title">奶蛙 · 属性</div>
        <div class="ap-sub" id="apSub">—</div>
      </div>
      <button class="ap-close" id="apClose" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="ap-list" id="apList"></div>
    <div class="ap-foot">点空白处关闭 · 后续升级会在这里成长</div>
  </div>
</div>

<!-- 回合结束：三选一升级（第 1/3/5/8/10 回合） -->
<div id="upgrade" class="upgrade" aria-hidden="true">
  <div class="up-card">
    <div class="up-head">
      <div class="up-title" id="upTitle">回合结束 · 三选一</div>
      <div class="up-sub" id="upSub">选一个带进下一回合</div>
    </div>
    <div class="up-list" id="upList"></div>
    <div class="up-foot">点一张卡片立即生效 · 同一项可以重复叠加</div>
  </div>
</div>

<!-- 首次操作提示：走起来之后自动淡出 -->
<div id="hint">在左半屏任意位置按住拖动</div>

<!-- 结算面板 -->
<div id="result" class="result" aria-hidden="true">
  <div class="rs-card">
    <div class="rs-tag" id="rsTag">第一关 · 荒草地</div>
    <div class="rs-title" id="rsTitle">通关</div>
    <div class="rs-sub" id="rsSub">—</div>
    <div class="rs-grid" id="rsGrid"></div>
    <button class="rs-btn" id="rsBtn" type="button">再来一次</button>
  </div>
</div>

<!-- 加载遮罩 -->
<div id="loading">
  <div class="ld-box">
    <div class="ld-title">正在唤醒奶蛙</div>
    <div class="ld-bar"><i id="ldBar"></i></div>
    <div class="ld-txt" id="ldTxt">0%</div>
  </div>
</div>

<!-- 不用 importmap：老手机浏览器（iOS 16.4 以下、旧版微信/安卓 WebView）
     不支持 import maps，会让整个模块解析失败、加载页永远停在 0%。
     项目内所有 import 都写成相对路径，直接靠原生 ES Module 解析。 -->
<script type="module" src="js/main.js?v=7"></script>

<!-- 兜底自检：模块没跑起来时把原因写出来，别让用户对着 0% 干等 -->
<script>
(function () {
  function fail(text) {
    var t = document.getElementById('ldTxt');
    if (!t) return;
    t.textContent = text;
    t.style.color = '#ff8a78';
    t.style.fontSize = '12px';
    t.style.letterSpacing = '0';
  }
  // 脚本 404 / 解析失败都会派发到脚本元素上（捕获阶段才拿得到）
  window.addEventListener('error', function (e) {
    if (window.__naiwaBooted) return;
    var el = e.target;
    if (el && el.tagName === 'SCRIPT') fail('脚本加载失败，请检查网络后刷新');
  }, true);

  setTimeout(function () {
    if (window.__naiwaBooted) return;
    var hasModule = 'noModule' in document.createElement('script');
    fail(hasModule ? '加载超时，请刷新重试' : '浏览器版本过低，请用最新版 Chrome / Safari 打开');
  }, 9000);
})();
</script>
</body>
</html>
