<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#12251f"/>
  <!-- 一颗心：回血技能，配色跟治疗特效的亮青绿一致 -->
  <path d="M32 52 C18 42 12 34 12 27 C12 20 17 16 23 16 C27 16 30 18 32 21 C34 18 37 16 41 16 C47 16 52 20 52 27 C52 34 46 42 32 52 Z"
        fill="#7df0b0" opacity="0.92"/>
