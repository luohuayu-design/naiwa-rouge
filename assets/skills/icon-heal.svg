  <g stroke="#12251f" stroke-width="5" stroke-linecap="round">
    <path d="M32 25 L32 41"/>
    <path d="M24 33 L40 33"/>
  </g>
  <!-- 上浮的小光点，和技能特效呼应 -->
  <g fill="#eafff4">
    <circle cx="46" cy="12" r="2.2" opacity="0.85"/>
    <circle cx="53" cy="20" r="1.6" opacity="0.6"/>
  </g>
</svg>
